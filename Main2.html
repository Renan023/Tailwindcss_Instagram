<!DOCTYPE html>
<html lang="ot-br">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/output.css">
    <title>Projeto Personalizado</title>

</head>

<body class="bg-linear-to-tl from-white via-pink-300 to-red-600 ">

    <div class="w-screen h-screen grid grid-cols-2 grid-rows-6 " id="container">

        <div class="grid-cols-1 flex flex-col row-span-5 border-2 " id="">

            <img src="./image/Logo.png" alt="logo" class="w-52 my-3 mx-10 " id="logo">
            <h1 class="text-center text-4xl px-50">Veja momentos do dia a dia dos seus amigos próximos</h1>
            <img src="./image/teste_instagram.png" alt="imagem principal" class="w-max-10 px-20 py-20">

        </div>

        <div class="grid-cols-1 border-2 flex flex-col justify-center row-span-5 items-center ">

            <form  class="flex flex-col gap-4 border">

                <p class="font-bold">Entrar</p>
                <input placeholder="Nome do usuário, email ou telefone" class="bg-white w-full h-7 border rounded-sm ">
                <input placeholder="Senha" class="bg-white w-full h-7 border rounded-sm">

                <button class="bg-linear-to-l from-blue-400 to-white w-full h-6  rounded-lg cursor-pointer">Log in</button>
                <p class="font-bold ">Esqueceu a senha?</p>

            </form>

            <div class="border-2 my-5 gap-4 px-10 flex flex-col py-5">

                <button class=" rounded-lg bg-linear-to-br from-white to-blue-800  cursor-pointer px-5 py-1">Logar com Facebook</button>
                <button class="rounded-lg bg-white px-5 py-1">Criar uma nova conta</button>

            </div>

            <img src="./image/Logo_Meta.png" alt="Logo_meta" class="w-35">

        </div>
        
    </div>
</body>
</html>
